# KITTI DataModule configuration

_target_: unical.data.datamodule.KittiDataModule

data_dir: ${data_dir}   # resolved from top-level train.yaml

batch_size:  8
num_workers: 4       # reduce to 0 if DataLoader workers crash on macOS
pin_memory:  false   # MPS does not support pinned memory; harmless to leave false on CUDA

# Window of consecutive frames per sample. sequence_length=1 (default) reproduces
# the original single-frame behaviour exactly; set >1 to enable temporal fusion
# (see model.temporal) and multi-frame spatial-loss supervision.
sequence_length: 1
frame_stride:    1

# Splits — imported from experiment config (see configs/experiment/)
splits: ${experiment.splits}

# Legacy relative perturbation in camera coordinates. To model independent
# sensor-local mount drift, use DualErrorGenerator with r_range_lidar,
# t_range_lidar, r_range_cam and t_range_cam instead (see README).
decalibrator:
  _target_: unical.data.decalibrator.ErrorGenerator
  r_range: 1.0     # degrees per axis
  t_range: 10.0    # centimetres per axis

# Preprocessor: resizes image + LiDAR map, applies augmentation, normalises
preprocessor:
  _target_: unical.data.preprocessor.DataPreprocessor
  cfg:
    _target_: unical.data.preprocessor.PreprocessorConfig
    width:         512
    height:        512
    grayscale:     false
    add_intensity: false   # set to true to include LiDAR intensity as a second channel
                           # (also set backbone.lidar_channels=2)
    min_depth:     2.0     # metres; removes near-field noise and the vehicle body
    max_depth:     80.0    # metres; discards very sparse distant returns
    augmentation:
      _target_: unical.utils.augmentation.AugmentationConfig
      # All sub-configs (photometric, point_cloud, spatial) default to null (no augmentation).
      # Example — enable photometric jitter during training:
      # photometric:
      #   _target_: unical.utils.augmentation.PhotometricConfig
