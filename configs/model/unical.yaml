# UniCal model configuration

_target_: unical.models.module.UniCal

lr:            3.0e-5
weight_decay:  1.0e-4
warmup_epochs: 5

backbone:
  _target_: unical.models.backbone.MobileViTBackbone
  img_channels:        3
  lidar_channels:      1    # must match preprocessor.cfg.add_intensity (2 if true)
  image_size:          512
  hidden_sizes:        [144, 192, 240]
  num_attention_heads: 4
  patch_size:          2
  conv_kernel_size:    3
  # ImageNet-pretrained weights; the 3-channel stem is inflated to 4 channels.
  # Set to null to train the backbone from scratch.
  pretrained:          apple/mobilevit-small
  spatial_head:        true

head:
  _target_: unical.models.head.SplitRegressionHead
  # MobileViT-S with hidden_sizes=[144,192,240] produces a 640-dim feature vector
  # after global average pooling of last_hidden_state.
  in_features:   640
  common_hidden: []
  trans_hidden:  [640, 256]
  rot_hidden:    [640, 256]
  rot_dim:       6          # continuous 6-D rotation representation

loss:
  _target_: unical.losses.combined.CombinedLoss
  regression:
    _target_: unical.losses.regression.RegressionLoss
    trans_weight: 1.0
    rot_weight:   1.0
  spatial:
    _target_: unical.losses.spatial.SpatialLoss
    centroid_weight: 1.0
    pcl_weight:      1.0
