# Main training configuration
# Run with: python train.py data_dir=/path/to/kitti_raw

defaults:
  - data: kitti
  - model: unical
  - experiment: default
  - logger: csv          # override with `logger=wandb` to track on Weights & Biases
  - _self_

# ── Paths ────────────────────────────────────────────────────────────────────
data_dir:  ???          # set via CLI: data_dir=/path/to/kitti_raw
log_dir:   logs/

# ── Trainer ─────────────────────────────────────────────────────────────────
trainer:
  max_epochs:      500          # convergence typically reached by ~400 epochs
  accelerator:     auto         # auto-selects CUDA on Linux, MPS on Apple Silicon, CPU otherwise
  devices:         1
  precision:       "32-true"    # safe default; switch to "bf16-mixed" on Ampere+ GPUs
                                # for ~40 % speedup with negligible accuracy impact
  log_every_n_steps: 20
  val_check_interval: 1.0       # run validation once per epoch
  gradient_clip_val: 1.0        # clip gradient L2 norm; prevents explosion during
                                # the first few warmup epochs (spatial loss can spike)

seed: 42
