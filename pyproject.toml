[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unical-plus"
version = "0.1.0"
description = "UniCal++: Camera-LiDAR extrinsic calibration via MobileViT"
readme = "README.md"
license = {text = "CC BY-NC 4.0"}
requires-python = ">=3.11"
keywords = [
    "camera-lidar calibration",
    "extrinsic calibration",
    "sensor fusion",
    "MobileViT",
    "autonomous driving",
    "KITTI",
    "deep learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: Free for non-commercial use",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pytorch-lightning>=2.2.0",
    "transformers>=4.38.0",
    "einops>=0.7.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "scipy>=1.12.0",
    "pyarrow>=15.0.0",
    "kitti-c2l @ git+https://github.com/mcocheteux/KITTI-C2L-Dataset.git",
]

[project.urls]
Homepage = "https://github.com/mcocheteux/unical-plus"
Repository = "https://github.com/mcocheteux/unical-plus"

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
]
logger = [
    "wandb>=0.16.0",
    "tensorboard>=2.16.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/unical"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
